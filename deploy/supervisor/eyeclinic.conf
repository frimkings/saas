; Supervisor programs for EyeClinic background work.
;
; Install on the server (Ubuntu/Debian):
;   sudo apt install supervisor
;   sudo cp deploy/supervisor/eyeclinic.conf /etc/supervisor/conf.d/eyeclinic.conf
;   (edit APP_DIR and USER below if the app is not in /var/www/eyeclinic or not run as www-data)
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status eyeclinic:*
;
; After every deploy, let workers finish their current job and pick up the new code:
;   php artisan queue:restart
;
; Logs: /var/www/eyeclinic/storage/logs/worker-*.log (rotate with logrotate).

[group:eyeclinic]
programs=eyeclinic-default,eyeclinic-imports,eyeclinic-scheduler

; Emails, SMS and WhatsApp. Short jobs; two processes so one slow gateway call
; doesn't hold up the rest.
[program:eyeclinic-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/eyeclinic/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600 --memory=256
directory=/var/www/eyeclinic
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/www/eyeclinic/storage/logs/worker-default.log

; Legacy clinic imports. One at a time; each can run up to 15 minutes
; (CommitLegacyClinicImport::$timeout = 900, queue retry_after = 960).
[program:eyeclinic-imports]
process_name=%(program_name)s
command=php /var/www/eyeclinic/artisan queue:work database --queue=imports --sleep=5 --tries=3 --timeout=930 --max-time=7200 --memory=512
directory=/var/www/eyeclinic
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/www/eyeclinic/storage/logs/worker-imports.log

; Scheduler: reminders, recalls, billing runs, SMS balance check, heartbeats.
; (Alternative: a cron line "* * * * * www-data cd /var/www/eyeclinic && php artisan schedule:run".
; Use one or the other, not both.)
[program:eyeclinic-scheduler]
process_name=%(program_name)s
command=php /var/www/eyeclinic/artisan schedule:work
directory=/var/www/eyeclinic
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/eyeclinic/storage/logs/scheduler.log
